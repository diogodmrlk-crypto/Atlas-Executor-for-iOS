name: Atlas Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create imgui symlink to root
        run: |
          ln -sfn . imgui
          ls -la

      - name: Compile
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK_PATH"

          clang++ -dynamiclib -std=c++17 \
          -isysroot "$SDK_PATH" \
          -target arm64-apple-ios14.0 \
          -fobjc-arc \
          -framework Foundation -framework UIKit -framework Metal -framework QuartzCore \
          Atlas.mm imgui.cpp imgui_draw.cpp imgui_widgets.cpp imgui_impl_metal.mm \
          -I./ -I./imgui \
          -o AtlasExecutor.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Final-Dylib
          path: AtlasExecutor.dylib
